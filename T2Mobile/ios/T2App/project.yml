# The Xcode project is GENERATED from this file by XcodeGen (https://github.com/yonaskolb/XcodeGen):
#     ../mac_setup.sh            does everything (see docs/IOS.md), or by hand:
#     xcodegen generate && open T2.xcodeproj
# T2.xcodeproj and Info.plist are therefore not in git. Change settings HERE (or in
# Config/T2.xcconfig), not in Xcode's build settings editor: they would be lost on the
# next generation.
name: T2
options:
  deploymentTarget:
    iOS: "17.0"          # Observation (@Observable) and ContentUnavailableView need iOS 17
  createIntermediateGroups: true
configFiles:
  Debug: Config/T2.xcconfig
  Release: Config/T2.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  T2Kit:
    path: ../T2Kit
targets:
  T2:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: T2Kit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: T2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # the app only uses https (standard, exempt encryption): no export paperwork
        ITSAppUsesNonExemptEncryption: false
        # development only: allows plain http to a service on the local network / this Mac
        # (e.g. an SSH tunnel to a test instance of t2api). The public service is https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # exported figures live in Documents/Figures, which the Files app shows ("On My iPhone > T2")
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: T2 adds the figures you export to your photo library only when you ask it to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T2_BUNDLE_ID)
        PRODUCT_NAME: T2
        TARGETED_DEVICE_FAMILY: "1"          # iPhone (an iPad runs it in iPhone mode)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  # unit tests of the app's own code (the drawing of figures): they run in the simulator,
  # hosted by the app, together with the UI tests
  T2AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: T2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T2_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  T2UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: T2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T2_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: T2
schemes:
  T2:
    build:
      targets:
        T2: all
        T2AppTests: [test]
        T2UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - T2AppTests
        - T2UITests
    archive:
      config: Release
