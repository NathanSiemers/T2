## t2api, STANDALONE DEVELOPMENT copy: NOT reachable from the internet.
## The published service is the `t2api` service in /scratch/Docker/ShinyPublic/docker-compose.yml
## (same image, built from this directory). Use this file to try changes beside it:
##     docker compose up -d --build
##     T2API_NET=t2api-dev T2API_HOST=t2api-dev T2API_PORT=3861 ./test.sh
## - listens on 127.0.0.1:3861 on this host only, and as `t2api-dev` on its own internal
##   Docker network `t2api-dev`
## - same lockdown as the public Shiny containers: read-only filesystem, unprivileged
##   user, no capabilities, memory ceiling without swap; databases mounted read-only
## Named extra instances (T2Mobile/ops/devstack.sh): T2API_DEV_NAME / T2API_DEV_PORT / T2API_DEV_NET /
## T2API_DEV_IMAGE give a second, independent copy (own container, image tag, port and network) so one
## test run never has to stop another; the defaults are the canonical t2api-dev.
services:
  t2api:
    build: .
    image: ${T2API_DEV_IMAGE:-t2api:dev}
    container_name: ${T2API_DEV_NAME:-t2api-dev}
    restart: unless-stopped
    command: ["-addr", ":8080", "-datasets", "/data/datasets", "-cache-mb", "512"]
    user: "999:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 4g
    memswap_limit: 4g
    oom_score_adj: 800
    pids_limit: 256
    cpus: 8
    ports: ["127.0.0.1:${T2API_DEV_PORT:-3861}:8080"]
    networks: [t2api-dev]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ## DEVELOPMENT copies of the databases, /scratch/nathan/R/T2-devdata (its README; the published service mounts
    ## /scratch/shinyusb/T2-data-<date>/): a change to a dataset's metadata is tried here first
    volumes:
      - /scratch/nathan/R/T2-devdata/datasets:/data/datasets:ro

networks:
  t2api-dev:
    name: ${T2API_DEV_NET:-t2api-dev}
