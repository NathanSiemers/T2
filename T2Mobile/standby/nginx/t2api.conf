## T2 API standby: Nginx in front of t2api on a small machine (see ../docker-compose.yml).
## Limits are for a dozen real users AND a flood at the same time:
##   per address   20 requests/s with a burst of 60 (a phone fetches a few columns per plot),
##                 10 connections
##   in total      200 requests/s, burst 400: more than the machine should ever be asked,
##                 so a distributed flood is turned away here before it reaches the service
##   contact form  1 message/minute per address
## Only /api/t2/v1/... and /api/t2/healthz are proxied; every other path is the down page.
limit_req_zone $binary_remote_addr zone=api_ip:10m   rate=20r/s;
limit_req_zone $server_name        zone=api_all:1m   rate=200r/s;
limit_req_zone $binary_remote_addr zone=contact_ip:1m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status 429;
limit_conn_status 429;
## successful API requests are not logged (the app's privacy policy); failures are
map $status $failed { ~^[23] 0; default 1; }

server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }     # HTTP-01, if used
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name www.fiveprime.org fiveprime.org;
    ssl_certificate     /etc/letsencrypt/live/www.fiveprime.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.fiveprime.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    ## small machine: short timeouts and small buffers keep a slow-client flood cheap
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    keepalive_requests    200;
    client_max_body_size  32k;
    client_header_buffer_size 4k;
    large_client_header_buffers 2 8k;
    limit_conn conn_ip 10;

    ## the service
    location = /api/t2/healthz {
        rewrite ^ /healthz break;
        proxy_pass http://t2api:8080;
        access_log off;
    }
    location = /api/t2/v1/contact {
        rewrite ^/api/t2/(.*)$ /$1 break;
        proxy_pass http://t2api:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=contact_ip burst=3 nodelay;
        limit_req zone=api_all burst=400 nodelay;
        access_log /var/log/nginx/access.log combined if=$failed;
    }
    location /api/t2/v1/ {
        rewrite ^/api/t2/(.*)$ /$1 break;
        proxy_pass http://t2api:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        ## buffered: the service writes its answer into Nginx in milliseconds and frees its
        ## in-flight token; a slow-reading client then costs Nginx a buffer, not the service
        ## (with buffering off, ten slow readers per address could hold all 32 tokens)
        proxy_buffering on;
        proxy_buffers 32 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 16m;
        limit_req zone=api_ip  burst=60  nodelay;
        limit_req zone=api_all burst=400 nodelay;
        access_log /var/log/nginx/access.log combined if=$failed;
    }

    ## everything else: the websites live at home
    location / {
        root /usr/share/nginx/html;
        try_files /down.html =503;
        add_header Cache-Control "no-store";
        access_log off;
    }
}
